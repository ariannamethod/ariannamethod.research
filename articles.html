<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arianna Method Articles</title>
<meta name="description" content="Every article of the Arianna Method, listed from the published and inwork folders as they stand." />
<meta name="color-scheme" content="light dark" />
<style>
:root{
  color-scheme:light dark;
  --bg:#ffffff;
  --fg:#000000;
  --muted:#6e6e73;
  --hair:#d2d2d7;
  --accent:#bf4800;
  --on-accent:#ffffff;
  --mono:ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000;
    --fg:#ecebe8;
    --muted:#a1a1a6;
    --hair:#2c2c2e;
    --accent:#ff6b1f;
    --on-accent:#000000;
  }
}
*{box-sizing:border-box}
::selection{background:var(--accent); color:var(--on-accent)}
a:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--sans); font-size:17px; line-height:1.62; letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
#topbar{
  padding:16px 36px 0;
  font-family:var(--sans); font-weight:900; font-size:15px; letter-spacing:-.02em; line-height:1;
}
#topbar a{color:var(--fg); text-decoration:none}
#topbar a span{color:var(--accent)}
#topbar a:hover{color:var(--accent)}
main{max-width:44rem; margin:0 0 0 36px; padding:56px 0 96px}
h1{
  margin:0 0 .5em;
  font-weight:900; font-size:clamp(36px, 6.6vw, 76px); line-height:.94; letter-spacing:-.045em;
}
ul{list-style:none; margin:0; padding:0; border-top:1px solid var(--hair)}
li{display:flex; gap:6px 16px; align-items:baseline; padding:12px 0; border-bottom:1px solid var(--hair)}
li a{font-weight:700; color:var(--fg); text-decoration-color:var(--accent); text-decoration-thickness:2px; text-underline-offset:5px}
li a:hover{color:var(--accent)}
.tag{margin-left:auto; font-family:var(--mono); font-size:13px; color:var(--muted)}
.note{margin:18px 0 0; font-family:var(--mono); font-size:14px; color:var(--muted)}
@media (max-width:640px){
  #topbar{padding:14px 16px 0}
  main{margin:0 16px; padding:36px 0 72px}
  li{flex-wrap:wrap}
}
@media print{
  :root{--bg:#ffffff; --fg:#000000; --muted:#555555; --accent:#bf4800}
}
</style>
</head>
<body>
<header id="topbar"><a href="index.html">ARIANNA METHOD<span>.</span></a></header>
<main>
<h1>articles</h1>
<ul id="list"></ul>
<p class="note" id="note">reading published/ and inwork/</p>
<noscript><p class="note">The list is built from the folders themselves: <a href="published/">published/</a> and <a href="inwork/">inwork/</a>.</p></noscript>
</main>
<script>
(() => {
  'use strict';
  const FOLDERS = ['published', 'inwork'];

  // the server's directory index, JSON ["a.md", ...] or HTML <a href="a.md">: the same reading as mycListDir in ariannamethod.html
  function listDir(body){
    const t = body.trim();
    let names = [];
    if(t[0] === '['){ try { const a = JSON.parse(t); if(Array.isArray(a)) names = a.map(String); } catch(e){} }
    if(!names.length){
      const re = /href\s*=\s*["']([^"'?#]+)["']/gi; let m;
      while((m = re.exec(body))){
        let h = m[1];
        try { h = decodeURIComponent(h); } catch(e){}
        if(h.endsWith('/') || h.startsWith('..') || h.includes('://')) continue;
        names.push(h.split('/').pop());
      }
    }
    const seen = new Set();
    return names.filter(n => /\.(txt|md|markdown|text)$/i.test(n)
      && !/^readme\.md$/i.test(n)
      && !seen.has(n) && seen.add(n));
  }

  const title = n => n.replace(/\.(txt|md|markdown|text)$/i, '').replace(/[_-]+/g, ' ');

  async function scan(folder){
    try {
      const r = await fetch(folder + '/');
      return r.ok ? listDir(await r.text()).map(name => ({ folder, name })) : [];
    } catch(e){ return []; }
  }

  Promise.all(FOLDERS.map(scan)).then(parts => {
    const items = parts.flat(), ul = document.getElementById('list');
    for(const { folder, name } of items){
      const li = document.createElement('li'), a = document.createElement('a'), tag = document.createElement('span');
      a.href = folder + '/' + encodeURIComponent(name);
      a.textContent = title(name);
      tag.className = 'tag'; tag.textContent = folder;
      li.append(a, tag); ul.append(li);
    }
    document.getElementById('note').textContent = items.length ? '' : 'Nothing listed. The page has to be served: browsers do not list folders over file://.';
  });
})();
</script>
</body>
</html>
